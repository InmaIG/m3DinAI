# demos/profiling/config_profiling_demo.yaml
#
# Configuration for run_profiling_demo.py (profiling demo on the Zenodo example dataset).
#   demo.data_dir / out_dir            : where the demo data lives and where outputs go
#   demo.timepoints / replicates       : which acquisition sub-folders to process
#   demo.include_experiment_name_contains : only process experiment folders matching these tags
#   demo.keep_treatments               : subset of treatments used for the demo plots
#   pipeline.*                         : paths to the profiling scripts that the demo runs
demo:
  data_dir: "demo_data"
  out_dir: "demo_out"
  timepoints: ["72H"]
  replicates: ["R1"]
  include_experiment_name_contains: ["BT549"]
  keep_treatments: ["DMSO", "MMS", "Taxane"]

pipeline:
  feature_extraction: "scripts/profiling/1_feature_extraction.py"
  copy_excels: "scripts/profiling/2_copy_excels.py"
  label_treatments: "scripts/profiling/3_label_treatments.py"
  umap_clustering: "scripts/profiling/4_superclustering_individuals.py"