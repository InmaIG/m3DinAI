# demos/mdc/config_mdc_demo.yaml

# Where the Zenodo dataset will be downloaded/extracted
data_dir: demos/mdc/demo_mdc_data

# Where to write demo outputs (optional; the MDC pipeline mainly writes into the experiment folder)
out_dir: demos/mdc/demo_mdc_out

# Experiment folder name expected after extraction
# (i.e., <data_dir>/<experiment_dir>/Images and <data_dir>/<experiment_dir>/plate_map.csv)
experiment_dir: BT549_MDC

# Path to the MDC pipeline script inside this repository
mdc_pipeline_script: scripts/mdc/0_mdc_pipeline.py

# Main execution flags
skip_if_exists: true

# Optional: override plate map path (leave empty to use <experiment_dir>/plate_map.csv)
plate_map: ""

# Optional: restrict pipeline steps (leave empty to run defaults)
# Example: "3-10" if you only want to run segmentation→MDC when projections already exist
steps: ""

# Optional: recompute intermediates (only use if you want to force rebuilding)
rebuild_mip: false
rebuild_features: false
rebuild_clustering: false

# Optional: UMAP / clustering parameters (only used if your pipeline exposes these flags)
# If your current 0_mdc_pipeline.py does not accept them, keep them as documentation.
umap:
  n_neighbors: 15
  min_dist: 0.1
  random_state: 42

pca:
  n_components: 10

kmeans:
  n_clusters: 2
  random_state: 42